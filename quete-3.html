<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quête 3 · Carnet Piscine Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E8EEF0; --ink:#0F2129; --muted:#566D76; --rule:#D3DDE1;
  --accent:#00789A; --accent-ink:#FFFFFF; --accent-soft:#DCEFF5;
  --warn:#9A5B00; --warn-soft:#FBEFD9; --warn-rule:#E8C27F;
  --ok:#23734A; --ok-soft:#DDF1E5; --bad:#B03A2E; --bad-soft:#F8E1DE;
  --code-bg:#0F1E25; --code-ink:#D7E4E9; --code-dim:#7E98A2; --code-hl:rgba(76,196,230,.16); --code-rule:#1F343D;
  --tk-key:#FF9E7A; --tk-str:#A6DB86; --tk-num:#E9C46A; --tk-fn:#6FD3F2; --tk-type:#C9A2F2; --tk-com:#6F8A94; --tk-pkg:#8FB8C6;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1418; --surface:#122027; --sunk:#0E1A20; --ink:#E3ECEF; --muted:#8FA5AD; --rule:#23363F;
    --accent:#4CC4E6; --accent-ink:#06222C; --accent-soft:#12323D;
    --warn:#F2B75B; --warn-soft:#2B2213; --warn-rule:#5C4722;
    --ok:#6FD39B; --ok-soft:#133024; --bad:#F08A7E; --bad-soft:#35191A;
    --code-bg:#081216; --code-rule:#1A2C34;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1418; --surface:#122027; --sunk:#0E1A20; --ink:#E3ECEF; --muted:#8FA5AD; --rule:#23363F;
  --accent:#4CC4E6; --accent-ink:#06222C; --accent-soft:#12323D;
  --warn:#F2B75B; --warn-soft:#2B2213; --warn-rule:#5C4722;
  --ok:#6FD39B; --ok-soft:#133024; --bad:#F08A7E; --bad-soft:#35191A;
  --code-bg:#081216; --code-rule:#1A2C34;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top-h,64px) + 16px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.1;margin:0}
code,kbd,pre{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:10px 14px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand b{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--accent-ink);background:var(--accent);padding:2px 6px;border-radius:5px;letter-spacing:0}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav a{text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;padding:6px 10px;border-radius:7px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;user-select:none;white-space:nowrap;padding:6px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--surface)}
.switch{transition:border-color .15s ease}.switch:hover{border-color:var(--warn)}
.switch input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--rule);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--warn)}
.switch input:checked::after{transform:translateX(12px)}

main{padding-block:28px 80px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- accueil ---------- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end;padding-block:12px 32px;border-bottom:1px solid var(--rule);margin-bottom:32px}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-.025em;margin-top:10px}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.howto{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.howto li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;font-size:15px}
.howto kbd{font-size:12px;font-weight:600;background:var(--sunk);border:1px solid var(--rule);border-radius:5px;padding:2px 7px;white-space:nowrap}
.quests{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.qcard header{display:flex;justify-content:space-between;align-items:start;gap:12px}
.qcard h2{font-size:26px;font-weight:700}
.qcard h2 a{color:var(--ink);text-decoration:none}
.qcard h2 a:hover{color:var(--accent)}
.qnum{font-family:var(--display);font-weight:800;font-size:44px;line-height:.8;color:var(--accent);letter-spacing:-.04em}
.qcard p{margin:0;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--sunk);border:1px solid var(--rule);padding:3px 8px;border-radius:6px}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.homecta{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:16px;text-decoration:none;color:var(--ink);background:var(--sunk);border:1px solid var(--rule);border-radius:14px;padding:18px 22px}
.cta:hover{border-color:var(--accent)}
.cta strong{font-family:var(--display);font-size:21px;display:block}
.cta span{color:var(--muted);font-size:14px}
.cta em{font-style:normal;font-family:var(--mono);font-size:22px;color:var(--accent)}

/* ---------- page quête ---------- */
.qhead{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--rule);margin-bottom:28px}
.qhead h1{font-size:clamp(30px,4.6vw,50px);font-weight:800;letter-spacing:-.02em;margin-top:8px}
.qhead p{margin:10px 0 0;color:var(--muted);max-width:62ch}
.qpager{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:start}
.toc{position:sticky;top:calc(var(--top-h,64px) + 20px);display:flex;flex-direction:column;gap:2px}
.toc .eyebrow{margin-bottom:8px}
.toc a{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-family:var(--mono);font-size:13.5px;padding:6px 10px;border-radius:7px}
.toc a:hover{background:var(--sunk);color:var(--ink)}
.toc a.active{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--rule)}
.toc a .tick{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rule);flex:none}
.toc a .tick.on{background:var(--ok);border-color:var(--ok)}
.exlist{display:flex;flex-direction:column;gap:56px}

.ex{scroll-margin-top:calc(var(--top-h,64px) + 16px)}
.exhead{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.exhead > div{min-width:0}
.exhead h2{font-family:var(--mono);font-weight:600;font-size:clamp(21px,3vw,30px);letter-spacing:-.02em;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;overflow-wrap:anywhere}
.exhead h2 small{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:3px 8px;border:1px solid var(--rule);border-radius:999px}
.sig{display:block;margin-top:8px;font-family:var(--mono);font-size:14px;color:var(--accent);overflow-wrap:anywhere}
.mastered{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;padding:7px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);user-select:none}
.mastered input{width:16px;height:16px;accent-color:var(--ok);margin:0}
.mastered:has(input:checked){background:var(--ok-soft);border-color:transparent;color:var(--ok)}

.brief{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.brief > div{padding:16px 18px}
.brief > div + div{border-left:1px solid var(--rule)}
.brief h3{font-family:var(--body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
.brief p{margin:0;max-width:65ch}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tool{font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:5px}
.hidden-ex .brief .explain p,.hidden-ex .brief .explain .tools{filter:blur(6px);user-select:none}

.codegrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:14px;position:relative}
.codebox{background:var(--code-bg);border-radius:var(--radius);overflow:hidden;border:1px solid var(--code-rule);min-width:0}
.codebar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--code-rule);font-family:var(--mono);font-size:12.5px;color:var(--code-dim)}
.codebar .fname{color:var(--code-ink)}
.codebar button{background:transparent;border:1px solid var(--code-rule);color:var(--code-ink);border-radius:6px;padding:2px 9px;font-family:var(--mono);font-size:12px;cursor:pointer}
.codebar button:hover{border-color:var(--tk-fn);color:var(--tk-fn)}
.code{overflow-x:auto;padding:10px 0;font-size:13.5px;line-height:1.6;color:var(--code-ink);tab-size:4;-moz-tab-size:4}
.code .ln{display:block;white-space:pre;padding-right:16px;transition:background .15s ease}
.code .ln::before{content:attr(data-n);display:inline-block;width:3.2em;color:var(--code-dim);text-align:right;padding-right:1.1em;user-select:none;-webkit-user-select:none}
.code .ln.hl,.code .ln.pin{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--tk-fn)}
.code .ln.hl::before,.code .ln.pin::before{color:var(--tk-fn)}
.k{color:var(--tk-key)}.s{color:var(--tk-str)}.n{color:var(--tk-num)}.f{color:var(--tk-fn)}.t{color:var(--tk-type)}.c{color:var(--tk-com);font-style:italic}.p{color:var(--tk-pkg)}
.veil{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,var(--surface) 12px 24px);border:1px dashed var(--warn-rule);border-radius:var(--radius);padding:20px;z-index:2}
.veil p{margin:0;font-weight:700}
.veil span{color:var(--muted);font-size:14px;max-width:44ch}
.hidden-ex .veil{display:flex}
.hidden-ex .codegrid{min-height:240px}

.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.notes li{display:grid;grid-template-columns:4.6em 1fr;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid transparent;font-size:14.5px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease}
.notes li:hover,.notes li:focus-visible{border-color:var(--accent);outline:none}
.notes li[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.notes li b{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);padding-top:2px;white-space:nowrap}
.warnbox{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--warn-soft);border:1px solid var(--warn-rule);border-radius:var(--radius);padding:12px 16px;font-size:15px}
.warnbox strong{color:var(--warn);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px;white-space:nowrap}
.warnbox p{margin:0}
.warnbox code,.brief code,.notes code{font-size:.88em;background:var(--sunk);padding:1px 4px;border-radius:4px}

.testgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:14px}
.term{background:var(--code-bg);border:1px solid var(--code-rule);border-radius:var(--radius);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.term pre{margin:0;padding:12px 16px;color:var(--code-ink);font-size:13.5px;line-height:1.6;overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-all}
.term pre .prompt{color:var(--tk-str)}
.term .onote{padding:8px 16px 12px;font-size:13px;color:var(--code-dim);font-family:var(--body);border-top:1px solid var(--code-rule)}
.sub{font-family:var(--body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 0}

/* ---------- antisèche ---------- */
.sheet{columns:2 420px;column-gap:22px}
.sheet section{break-inside:avoid;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;margin:0 0 22px}
.sheet h2{font-size:22px;font-weight:700;margin-bottom:10px}
.sheet p{margin:8px 0;color:var(--ink)}
.sheet .muted{color:var(--muted);font-size:14px}
.snip{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.6;overflow-x:auto;margin:10px 0;white-space:pre;tab-size:4}
.ascii{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.ascii div{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
.ascii div b{color:var(--accent);font-weight:600}
.ascii div span{color:var(--muted);font-size:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl td:first-child{font-family:var(--mono);font-size:13px;white-space:nowrap}
.tblwrap{overflow-x:auto}
.patterns{display:flex;flex-direction:column;gap:12px}
.pattern{border-top:1px solid var(--rule);padding-top:12px}
.pattern:first-of-type{border-top:0;padding-top:0}
.pattern h3{font-family:var(--body);font-size:16px;font-weight:700}

/* ---------- quiz ---------- */
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.qpanel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px}
.qpanel .draw{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap}
.qpanel h2{font-family:var(--mono);font-weight:600;font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;margin-top:6px}
.timer{font-family:var(--mono);font-weight:600;font-size:40px;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.timer.late{color:var(--warn)}
.timerbox{text-align:right}
.timerbox .eyebrow{margin-bottom:6px}
.consigne{font-size:17px;max-width:68ch;margin:16px 0 0}
.qactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.draft{width:100%;min-height:260px;margin-top:18px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--code-rule);border-radius:var(--radius);padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.6;tab-size:4;resize:vertical}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.filters label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--surface)}
.filters label:has(input:checked){background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.filters input{margin:0;accent-color:var(--accent)}
.side{display:flex;flex-direction:column;gap:18px}
.side .qpanel{padding:18px}
.side h3{font-family:var(--body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.review{display:flex;flex-wrap:wrap;gap:6px}
.review .chip{background:var(--bad-soft);color:var(--bad);border-color:transparent;cursor:pointer}
.reveal{margin-top:22px}
.empty{color:var(--muted);font-size:14px;margin:0}


/* ---------- icônes, recherche, accessibilité ---------- */
.ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.125em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.searchbtn{display:flex;align-items:center;gap:8px;min-width:210px;padding:7px 8px 7px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);color:var(--muted);font-size:14px;cursor:pointer;transition:border-color .15s ease}
.searchbtn:hover{border-color:var(--accent);color:var(--ink)}
.searchbtn span{flex:1;text-align:left}
kbd.k2{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--sunk)}
.herosearch{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;margin-top:22px;padding:14px 14px 14px 18px;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--muted);font-size:17px;cursor:pointer;box-shadow:0 1px 0 var(--rule);transition:border-color .15s ease,box-shadow .15s ease}
.herosearch:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.herosearch .ic{color:var(--accent);width:20px;height:20px}
.herosearch span{flex:1;text-align:left}
dialog.pal{width:min(640px,calc(100vw - 32px));max-height:min(620px,calc(100dvh - 80px));margin:max(8vh,24px) auto auto;padding:0;border:1px solid var(--rule);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(4,20,26,.35);overflow:hidden}
dialog.pal[open]{display:flex;flex-direction:column}
dialog.pal::backdrop{background:rgba(6,18,24,.55);backdrop-filter:blur(2px)}
.palhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.palhead .ic{color:var(--accent);width:20px;height:20px}
.palhead input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:6px 0}
.palhead button{border:1px solid var(--rule);background:var(--sunk);border-radius:6px;padding:2px 8px;font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer}
.palres{list-style:none;margin:0;padding:8px;overflow-y:auto}
.palres li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border-radius:9px;text-decoration:none;color:var(--ink);min-height:44px}
.palres li a b{font-family:var(--mono);font-weight:600;font-size:15px}
.palres li a small{grid-column:1/-1;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palres li a em{font-style:normal;font-size:12px;color:var(--muted);font-family:var(--mono);align-self:center}
.palres li a[aria-selected="true"]{background:var(--accent-soft)}
.palres li a[aria-selected="true"] b{color:var(--accent)}
.palres mark{background:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.palempty{padding:18px 16px;color:var(--muted);font-size:15px}
.palfoot{display:flex;gap:16px;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted)}
.exnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px dashed var(--rule)}
.exnav a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:9px;border:1px solid transparent;min-height:44px;transition:border-color .15s ease}
.exnav a:hover{border-color:var(--rule)}
.exnav a span{font-size:12px;color:var(--muted)}
.exnav a b{font-family:var(--mono);font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px}
.exnav a.next{text-align:right;margin-left:auto}
.exnav a.next b{justify-content:flex-end}
.btn,.nav a,.chip,.toc a,.cta,.qcard h2 a{transition:border-color .15s ease,background .15s ease,color .15s ease}
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:10px}
.compare h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.draftview{margin:0;background:var(--sunk);border:1px dashed var(--rule);border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.6;white-space:pre;overflow:auto;tab-size:4;min-height:120px;color:var(--ink)}
.timerctl{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.switch .eyeoff{display:none;width:18px;height:18px;color:var(--muted)}
.switch:has(input:checked) .eyeoff{color:var(--warn)}
@media (pointer:coarse){
  .nav a,.btn,.mastered,.switch,.toc a,.searchbtn,.iconbtn{min-height:44px}
  .iconbtn{width:44px}
  .chip{min-height:36px;display:inline-flex;align-items:center;padding-inline:10px}
  .notes li{min-height:44px}
}

@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .toc{top:var(--top-h,64px);z-index:10;flex-direction:row;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
  .toc::-webkit-scrollbar{display:none}
  .toc .eyebrow{display:none}
  .toc a{flex:none;background:var(--surface);box-shadow:inset 0 0 0 1px var(--rule)}
  .toc a.active{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
  html{scroll-padding-top:calc(var(--top-h,64px) + 76px)}
  .ex{scroll-margin-top:calc(var(--top-h,64px) + 76px)}
  .compare{grid-template-columns:minmax(0,1fr)}
  .codegrid,.testgrid{grid-template-columns:minmax(0,1fr)}
  .quiz{grid-template-columns:minmax(0,1fr)}
  .qpanel{min-width:0}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .quests,.homecta{grid-template-columns:minmax(0,1fr)}
  .brief{grid-template-columns:minmax(0,1fr)}
  .brief > div + div{border-left:0;border-top:1px solid var(--rule)}
  .nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .nav::-webkit-scrollbar{display:none}
  .nav{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent);padding-right:40px}
  .timerbox{text-align:left}
  .timerctl{justify-content:flex-start}
  .top .wrap{justify-content:space-between}
  .searchbtn{min-width:0;padding:8px 10px;margin-left:auto}
  .searchbtn span,.searchbtn kbd{display:none}
  .switch{padding:6px 10px}
  .switch .txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .switch .eyeoff{display:inline-block}
  .toc{margin-inline:-16px;padding-inline:16px}
  .herosearch{font-size:15px}
  .herosearch kbd{display:none}
  .timer{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  .top,.toc,.qpager,.mastered,.veil,.codebar button,.exnav,dialog{display:none!important}
  body{background:#fff;color:#000}
  .layout{grid-template-columns:minmax(0,1fr)}
  .hidden-ex .brief .explain p,.hidden-ex .brief .explain .tools{filter:none}
  .ex{break-inside:avoid-page}
  .term pre{max-height:none}
}

tring) rune {\n\tr := []rune(s)\n\treturn r[len(r)-1]\n}\n", "test": "package main\n\nimport (\n\t\"piscine\"\n\n\t\"github.com/01-edu/z01\"\n)\n\nfunc main() {\n\tz01.PrintRune(piscine.LastRune(\"Hello!\"))\n\tz01.PrintRune(piscine.LastRune(\"Salut!\"))\n\tz01.PrintRune(piscine.LastRune(\"Ola!\"))\n\tz01.PrintRune('\\n')\n}\n", "output": "!!!"}, {"id": "nrune", "quest": 2, "kind": "Fonction", "file": "nrune.go", "sig": "func NRune(s string, n int) rune", "consigne": "Écrire une fonction qui renvoie la n-ième rune d'une chaîne. Si ce n'est pas possible, elle renvoie 0.", "bref": "n compte à partir de 1 (1 = premier caractère). On vérifie d'abord que n est dans les bornes, sinon on renvoie 0. Sinon on renvoie r[n-1].", "tools": ["vérif. des bornes", "[]rune(s)", "r[n-1]"], "lines": [[4, 6, "Cas impossibles : n inférieur à 1 ou plus grand que la chaîne → 0."], [7, 7, "Conversion en []rune."], [9, 9, "Décalage de 1 car n commence à 1 alors que les indices commencent à 0."]], "note": "len(s) compte des octets, pas des caractères : avec des accents, n peut passer le test puis dépasser le slice. Comparer à len(r) après la conversion serait plus sûr.", "outputNote": "Pour -1 et 5, NRune renvoie 0 : PrintRune(0) écrit un caractère nul invisible, d'où « la!» à l'écran.", "code": "package piscine\n\nfunc NRune(s string, n int) rune {\n\tif n < 1 || n > len(s) {\n\t\treturn 0\n\t}\n\tr := []rune(s)\n\n\treturn r[n-1]\n}\n", "test": "package main\n\nimport (\n\t\"piscine\"\n\n\t\"github.com/01-edu/z01\"\n)\n\nfunc main() {\n\tz01.PrintRune(piscine.NRune(\"Hello!\", 3))\n\tz01.PrintRune(piscine.NRune(\"Salut!\", 2))\n\tz01.PrintRune(piscine.NRune(\"Bye!\", -1))\n\tz01.PrintRune(piscine.NRune(\"Bye!\", 5))\n\tz01.PrintRune(piscine.NRune(\"Ola!\", 4))\n\tz01.PrintRune('\\n')\n}\n", "output": "la!"}, {"id": "compare", "quest": 2, "kind": "Fonction", "file": "compare.go", "sig": "func Compare(a, b string) int", "consigne": "Écrire une fonction qui se comporte comme la fonction Compare de Go (strings.Compare) : 0 si a == b, -1 si a < b, 1 si a > b.", "bref": "Go sait comparer deux string directement avec == et > (ordre lexicographique, caractère par caractère). Il suffit de traduire le résultat en 0, 1 ou -1.", "tools": ["==  >  <", "else if"], "lines": [[4, 5, "Chaînes identiques → 0."], [6, 7, "a après b dans l'ordre lexicographique → 1."], [8, 10, "Sinon a est avant b → -1."]], "code": "package piscine\n\nfunc Compare(a, b string) int {\n\tif a == b {\n\t\treturn 0\n\t} else if a > b {\n\t\treturn 1\n\t} else {\n\t\treturn -1\n\t}\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.Compare(\"Hello!\", \"Hello!\"))\n\tfmt.Println(piscine.Compare(\"Salut!\", \"lut!\"))\n\tfmt.Println(piscine.Compare(\"Ola!\", \"Ol\"))\n}\n", "output": "0\n-1\n1"}, {"id": "alphacount", "quest": 2, "kind": "Fonction", "file": "alphacount.go", "sig": "func AlphaCount(s string) int", "consigne": "Écrire une fonction qui compte le nombre de lettres d'une chaîne et renvoie ce nombre. Seules les lettres de l'alphabet latin (a–z et A–Z) comptent. Tous les autres caractères (chiffres, symboles, espaces…) sont ignorés.", "bref": "On parcourt chaque rune et on incrémente un compteur quand son code est dans 65–90 (majuscules) ou 97–122 (minuscules).", "tools": ["for range", "compteur", "65–90 / 97–122"], "lines": [[4, 5, "Conversion en runes et compteur initialisé à 0."], [7, 7, "Majuscule (65–90) OU minuscule (97–122). && est évalué avant ||."], [8, 8, "Une lettre de plus."], [11, 11, "On renvoie le total."]], "code": "package piscine\n\nfunc AlphaCount(s string) int {\n\tr := []rune(s)\n\tcount := 0\n\tfor i := range r {\n\t\tif r[i] >= 65 && r[i] <= 90 || r[i] >= 97 && r[i] <= 122 {\n\t\t\tcount++\n\t\t}\n\t}\n\treturn count\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\ts := \"Hello 78 World!    4455 /\"\n\tfmt.Println(piscine.AlphaCount(s))\n}\n", "output": "10"}, {"id": "index", "quest": 2, "kind": "Fonction", "file": "index.go", "sig": "func Index(s string, toFind string) int", "consigne": "Écrire une fonction qui se comporte comme la fonction Index (strings.Index) : elle renvoie la position de la première occurrence de toFind dans s, ou -1 si elle est absente.", "bref": "Pour chaque position i où le caractère correspond à la première lettre de toFind, on compare les lettres suivantes une à une. Si toutes correspondent, on renvoie i. Sinon, après la boucle, on renvoie -1.", "tools": ["2 boucles", "compteur de correspondances", "return -1"], "lines": [[4, 6, "Chaîne vide ou recherche vide → 0."], [7, 8, "Les deux chaînes sont converties en runes."], [10, 11, "Candidat : le caractère courant est égal à la 1re lettre cherchée."], [13, 17, "Compte combien des lettres suivantes correspondent."], [18, 20, "Toutes les lettres restantes correspondent → position trouvée."], [24, 24, "Aucune correspondance complète."]], "note": "Si le début du mot est trouvé tout près de la fin de s (ex. Index(\"Hello\", \"loX\")), rs[i+k] sort du slice et le programme plante : la condition de la ligne 11 devrait être len(rs)-i >= len(rt). Autre écart : Index(\"\", \"a\") renvoie 0 au lieu de -1.", "code": "package piscine\n\nfunc Index(s string, toFind string) int {\n\tif len(s) <= 0 || len(toFind) <= 0 {\n\t\treturn 0\n\t}\n\trs := []rune(s)\n\trt := []rune(toFind)\n\n\tfor i, j := range rs {\n\t\tif j == rt[0] && len(rs)-i >= len(rt)-1 {\n\t\t\tcount := 0\n\t\t\tfor k := 1; k < len(rt); k++ {\n\t\t\t\tif rt[k] == rs[i+k] {\n\t\t\t\t\tcount++\n\t\t\t\t}\n\t\t\t}\n\t\t\tif count == len(rt)-1 {\n\t\t\t\treturn i\n\t\t\t}\n\t\t}\n\t}\n\n\treturn -1\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.Index(\"Hello!\", \"l\"))\n\tfmt.Println(piscine.Index(\"Salut!\", \"alu\"))\n\tfmt.Println(piscine.Index(\"Ola!\", \"hOl\"))\n}\n", "output": "2\n1\n-1"}, {"id": "concat", "quest": 2, "kind": "Fonction", "file": "concat.go", "sig": "func Concat(str1 string, str2 string) string", "consigne": "Écrire une fonction qui renvoie la concaténation des deux chaînes passées en arguments.", "bref": "En Go, l'opérateur + colle deux string. Une seule ligne suffit.", "tools": ["str1 + str2"], "lines": [[4, 4, "+ entre deux string crée une nouvelle chaîne."]], "code": "package piscine\n\nfunc Concat(str1 string, str2 string) string {\n\treturn str1 + str2\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.Concat(\"Hello!\", \" How are you?\"))\n}\n", "output": "Hello! How are you?"}, {"id": "isupper", "quest": 2, "kind": "Fonction", "file": "isupper.go", "sig": "func IsUpper(s string) bool", "consigne": "Écrire une fonction qui renvoie true si la chaîne passée en paramètre ne contient que des majuscules, sinon elle renvoie false.", "bref": "Modèle « chercher l'intrus » : dès qu'un caractère n'est pas entre 65 et 90, on renvoie false. Si la boucle se termine, tout est majuscule → true.", "tools": ["return anticipé", "65–90"], "lines": [[4, 4, "Conversion en runes."], [6, 8, "Hors de 'A'..'Z' → la réponse est forcément false, on sort tout de suite."], [10, 10, "Aucun intrus trouvé."]], "code": "package piscine\n\nfunc IsUpper(s string) bool {\n\tr := []rune(s)\n\tfor i := range r {\n\t\tif r[i] < 65 || r[i] > 90 {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.IsUpper(\"HELLO\"))\n\tfmt.Println(piscine.IsUpper(\"HELLO!\"))\n}\n", "output": "true\nfalse"}, {"id": "islower", "quest": 2, "kind": "Fonction", "file": "islower.go", "sig": "func IsLower(s string) bool", "consigne": "Écrire une fonction qui renvoie true si la chaîne passée en paramètre ne contient que des minuscules, sinon elle renvoie false.", "bref": "Exactement IsUpper avec la plage 97–122 ('a'..'z').", "tools": ["return anticipé", "97–122"], "lines": [[6, 8, "Hors de 'a'..'z' → false immédiatement."], [10, 10, "Tous les caractères sont des minuscules."]], "code": "package piscine\n\nfunc IsLower(s string) bool {\n\tr := []rune(s)\n\tfor i := range r {\n\t\tif r[i] < 97 || r[i] > 122 {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.IsLower(\"hello\"))\n\tfmt.Println(piscine.IsLower(\"hello!\"))\n}\n", "output": "true\nfalse"}, {"id": "isalpha", "quest": 2, "kind": "Fonction", "file": "isalpha.go", "sig": "func IsAlpha(s string) bool", "consigne": "Écrire une fonction qui renvoie true si la chaîne passée en paramètre ne contient que des caractères alphanumériques (lettres et chiffres) ou si elle est vide, et false sinon.", "bref": "Même modèle « chercher l'intrus » : la condition de la ligne 6 doit repérer tout caractère qui n'est ni chiffre, ni majuscule, ni minuscule. Si la boucle finit, on renvoie true (la chaîne vide donne donc true).", "tools": ["return anticipé", "48–57 / 65–90 / 97–122"], "lines": [[4, 4, "Conversion en runes."], [6, 8, "Détection d'un caractère non alphanumérique → false."], [10, 10, "Chaîne entièrement valide, ou vide."]], "note": "En pratique la condition de la ligne 6 ne rejette que ce qui est < 48 ou > 122 : des symboles comme : ; @ [ _ sont acceptés (IsAlpha(\"a[b@c\") donne true). Les tests du sujet passent parce qu'ils contiennent des espaces, ! ou ?. Version logique : if !(chiffre || majuscule || minuscule) { return false }.", "code": "package piscine\n\nfunc IsAlpha(s string) bool {\n\tr := []rune(s)\n\tfor i := range r {\n\t\tif (r[i] < 48 || r[i] > 122) && (r[i] < 48 || r[i] > 57) && (r[i] < 65 || r[i] > 57) && (r[i] < 97 || r[i] > 90) {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.IsAlpha(\"Hello! How are you?\"))\n\tfmt.Println(piscine.IsAlpha(\"HelloHowareyou\"))\n\tfmt.Println(piscine.IsAlpha(\"What's this 4?\"))\n\tfmt.Println(piscine.IsAlpha(\"Whatsthis4\"))\n}\n", "output": "false\ntrue\nfalse\ntrue"}, {"id": "isnumeric", "quest": 2, "kind": "Fonction", "file": "isnumeric.go", "sig": "func IsNumeric(s string) bool", "consigne": "Écrire une fonction qui renvoie true si la chaîne passée en paramètre ne contient que des chiffres, sinon elle renvoie false.", "bref": "Modèle « chercher l'intrus » avec la plage 48–57 ('0'..'9').", "tools": ["return anticipé", "48–57"], "lines": [[6, 8, "Tout caractère hors de '0'..'9' → false."], [10, 10, "Que des chiffres."]], "code": "package piscine\n\nfunc IsNumeric(s string) bool {\n\tr := []rune(s)\n\tfor i := range r {\n\t\tif r[i] < 48 || r[i] > 57 {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.IsNumeric(\"010203\"))\n\tfmt.Println(piscine.IsNumeric(\"01,02,03\"))\n}\n", "output": "true\nfalse"}, {"id": "isprintable", "quest": 2, "kind": "Fonction", "file": "isprintable.go", "sig": "func IsPrintable(s string) bool", "consigne": "Écrire une fonction qui renvoie true si la chaîne passée en paramètre ne contient que des caractères imprimables, sinon elle renvoie false.", "bref": "Les caractères de contrôle (\\n, \\t…) ont un code inférieur à 32. On rejette tout ce qui est hors de la plage imprimable.", "tools": ["return anticipé", "32–126"], "lines": [[6, 8, "Sous 32 = caractère de contrôle → false."], [10, 10, "Tous imprimables."]], "note": "Le code 127 (DEL) n'est pas imprimable mais passe le test r[i] > 127. La borne exacte est r[i] > 126.", "code": "package piscine\n\nfunc IsPrintable(s string) bool {\n\tr := []rune(s)\n\tfor i := range r {\n\t\tif r[i] < 32 || r[i] > 127 {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.IsPrintable(\"Hello\"))\n\tfmt.Println(piscine.IsPrintable(\"Hello\\n\"))\n}\n", "output": "true\nfalse"}, {"id": "toupper", "quest": 2, "kind": "Fonction", "file": "toupper.go", "sig": "func ToUpper(s string) string", "consigne": "Écrire une fonction qui met en majuscule chaque lettre d'une chaîne.", "bref": "Pour chaque minuscule (97–122), on retire 32 : c'est l'écart entre 'a' (97) et 'A' (65). Les autres caractères ne changent pas. On reconvertit le []rune en string.", "tools": ["[]rune modifiable", "−32", "string(r)"], "lines": [[4, 4, "Une string n'est pas modifiable : on passe par []rune."], [6, 10, "Minuscule → majuscule en soustrayant 32."], [11, 12, "Retour en string."]], "code": "package piscine\n\nfunc ToUpper(s string) string {\n\tr := []rune(s)\n\n\tfor i := range r {\n\t\tif r[i] >= 97 && r[i] <= 122 {\n\t\t\tr[i] -= 32\n\t\t}\n\t}\n\tst := string(r)\n\treturn st\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.ToUpper(\"Hello! How are you?\"))\n}\n", "output": "HELLO! HOW ARE YOU?"}, {"id": "tolower", "quest": 2, "kind": "Fonction", "file": "tolower.go", "sig": "func ToLower(s string) string", "consigne": "Écrire une fonction qui met en minuscule chaque lettre d'une chaîne.", "bref": "L'inverse de ToUpper : chaque majuscule (65–90) reçoit +32.", "tools": ["[]rune modifiable", "+32", "string(r)"], "lines": [[4, 4, "Conversion en runes pour pouvoir modifier."], [6, 10, "Majuscule → minuscule en ajoutant 32."], [11, 12, "Retour en string."]], "code": "package piscine\n\nfunc ToLower(s string) string {\n\tr := []rune(s)\n\n\tfor i := range r {\n\t\tif r[i] >= 65 && r[i] <= 90 {\n\t\t\tr[i] += 32\n\t\t}\n\t}\n\tst := string(r)\n\treturn st\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.ToLower(\"Hello! How are you?\"))\n}\n", "output": "hello! how are you?"}, {"id": "printnbrinorder", "quest": 2, "kind": "Fonction", "file": "printnbrinorder.go", "sig": "func PrintNbrInOrder(n int)", "consigne": "Écrire une fonction qui affiche les chiffres d'un int passé en paramètre dans l'ordre croissant. Toutes les valeurs possibles d'un int doivent fonctionner, sauf les négatifs. La conversion en int64 est interdite.", "bref": "Trois étapes : découper le nombre en chiffres (n%10 puis n/=10), trier ce tableau, puis afficher chaque chiffre en ajoutant '0' pour obtenir le caractère. Le cas 0 est traité à part, car la boucle de découpage ne tourne pas.", "tools": ["n % 10  /  n /= 10", "append", "tri à bulles", "+'0'"], "lines": [[6, 8, "0 ne produit aucun chiffre dans Convtotable, on l'affiche directement."], [9, 9, "Découpe, trie, puis parcourt les chiffres triés."], [10, 12, "Chiffre → caractère : 3 + '0' = '3'."], [16, 25, "Convtotable : récupère le dernier chiffre (n%10) et le retire (n/=10) jusqu'à 0."], [27, 38, "SortTable : échange deux cases tant qu'elles ne sont pas dans l'ordre (tri simple en O(n²))."]], "outputNote": "Aucun '\\n' dans la fonction : les trois appels s'affichent collés (123, 0, 123).", "code": "package piscine\n\nimport \"github.com/01-edu/z01\"\n\nfunc PrintNbrInOrder(n int) {\n\tif n == 0 {\n\t\tz01.PrintRune('0')\n\t}\n\tfor _, j := range SortTable(Convtotable(n)) {\n\t\tj += '0'\n\n\t\tz01.PrintRune(rune(j))\n\t}\n}\n\nfunc Convtotable(n int) (s []int) {\n\tfor n > 0 {\n\n\t\ts = append(s, n%10)\n\n\t\tn /= 10\n\n\t}\n\treturn s\n}\n\nfunc SortTable(t []int) []int {\n\tfor i := 0; i < len(t); i++ {\n\t\tfor j := 0; j < len(t); j++ {\n\t\t\tif t[i] < t[j] {\n\t\t\t\ta := t[j]\n\t\t\t\tt[j] = t[i]\n\t\t\t\tt[i] = a\n\t\t\t}\n\t\t}\n\t}\n\treturn t\n}\n", "test": "package main\n\nimport (\n\t\"piscine\"\n\n\t\"github.com/01-edu/z01\"\n)\n\nfunc main() {\n\tpiscine.PrintNbrInOrder(321)\n\tpiscine.PrintNbrInOrder(0)\n\tpiscine.PrintNbrInOrder(321)\n\tz01.PrintRune('\\n')\n}\n", "output": "1230123"}, {"id": "trimatoi", "quest": 2, "kind": "Fonction", "file": "trimatoi.go", "sig": "func TrimAtoi(s string) int", "consigne": "Écrire une fonction qui transforme les chiffres contenus dans une chaîne en un int. Si le signe - est rencontré avant tout chiffre, il détermine le signe de l'int renvoyé. La fonction renvoie seulement un int. En cas d'entrée invalide (aucun chiffre), elle renvoie 0. Note : il n'y aura jamais plus d'un signe dans une chaîne pendant les tests.", "bref": "Si la chaîne contient au moins un chiffre : on ignore tout ce qui n'est pas un chiffre et on construit le nombre avec x = x*10 + chiffre. Ensuite, on cherche un '-' situé avant le premier chiffre pour mettre le signe à -1.", "tools": ["x = x*10 + y", "continue", "break", "fonction utilitaire"], "lines": [[4, 5, "x = le nombre construit, si = le signe (1 ou -1)."], [7, 7, "Numeric vérifie qu'il y a au moins un chiffre, sinon on renvoie 0 (ligne 30)."], [9, 11, "Les caractères qui ne sont pas des chiffres sont sautés."], [12, 15, "Valeur du chiffre calculée en comptant de '1' jusqu'à la rune (équivaut à int(i - '0'))."], [16, 16, "On décale d'un rang et on ajoute le chiffre."], [18, 27, "Parcourt le début de la chaîne jusqu'au premier chiffre : si on croise '-', le résultat sera négatif."], [34, 44, "Numeric : true dès qu'un chiffre est trouvé."]], "code": "package piscine\n\nfunc TrimAtoi(s string) int {\n\tx := 0\n\tsi := 1\n\n\tif Numeric(s) {\n\t\tfor _, i := range s {\n\t\t\tif i < '0' || i > '9' {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\ty := 0\n\t\t\tfor k := '1'; k <= i; k++ {\n\t\t\t\ty++\n\t\t\t}\n\t\t\tx = x*10 + y\n\t\t}\n\t\tfor j := range s {\n\n\t\t\tif s[j] >= '0' && s[j] <= '9' {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tif s[j] == '-' {\n\t\t\t\tsi = -1\n\t\t\t}\n\n\t\t}\n\t\treturn x * si\n\t} else {\n\t\treturn 0\n\t}\n}\n\nfunc Numeric(s string) bool {\n\tr := []rune(s)\n\ttr := false\n\tfor i := range r {\n\t\tif r[i] >= 48 && r[i] <= 57 {\n\t\t\ttr = true\n\t\t\tbreak\n\t\t}\n\t}\n\treturn tr\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.TrimAtoi(\"12345\"))\n\tfmt.Println(piscine.TrimAtoi(\"str123ing45\"))\n\tfmt.Println(piscine.TrimAtoi(\"012 345\"))\n\tfmt.Println(piscine.TrimAtoi(\"Hello World!\"))\n\tfmt.Println(piscine.TrimAtoi(\"sd+x1fa2W3s4\"))\n\tfmt.Println(piscine.TrimAtoi(\"sd-x1fa2W3s4\"))\n\tfmt.Println(piscine.TrimAtoi(\"sdx1-fa2W3s4\"))\n\tfmt.Println(piscine.TrimAtoi(\"sdx1+fa2W3s4\"))\n}\n", "output": "12345\n12345\n12345\n0\n1234\n-1234\n1234\n1234"}, {"id": "capitalize", "quest": 2, "kind": "Fonction", "file": "capitalize.go", "sig": "func Capitalize(s string) string", "consigne": "Écrire une fonction qui met en majuscule la première lettre de chaque mot et en minuscule le reste des lettres. Un mot est une suite de caractères alphanumériques.", "bref": "Une lettre commence un mot si le caractère juste avant n'est pas alphanumérique. Au début d'un mot, une minuscule passe en majuscule. Au milieu d'un mot, une majuscule passe en minuscule. Le premier caractère est traité à part.", "tools": ["regarder r[i-1]", "±32", "fonctions utilitaires"], "lines": [[5, 7, "Le premier caractère commence forcément un mot : minuscule → majuscule."], [9, 15, "Majuscule précédée d'une lettre ou d'un chiffre = milieu de mot → minuscule."], [16, 22, "Minuscule précédée d'un séparateur = début de mot → majuscule."], [29, 34, "Vrai si la rune est un chiffre, une majuscule ou une minuscule."], [36, 50, "Petites fonctions de test minuscule / majuscule."]], "note": "r[0] sur une chaîne vide provoque un panic : Capitalize(\"\") plante.", "code": "package piscine\n\nfunc Capitalize(s string) string {\n\tr := []rune(s)\n\tif checkiflower(r[0]) {\n\t\tr[0] -= 32\n\t}\n\tfor i := 1; i < len(r); i++ {\n\t\tif checkifupper(r[i]) {\n\t\t\tif CheckIfLetterOrNumber(r[i-1]) {\n\t\t\t\tr[i] += 32\n\t\t\t}\n\t\t\tcontinue\n\n\t\t}\n\t\tif checkiflower(r[i]) {\n\t\t\tif CheckIfLetterOrNumber(r[i-1]) {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tr[i] -= 32\n\n\t\t}\n\t}\n\n\tst := string(r)\n\treturn st\n}\n\nfunc CheckIfLetterOrNumber(r rune) bool {\n\tif (r >= 48 && r <= 57) || (r >= 65 && r <= 90) || (r >= 97 && r <= 122) {\n\t\treturn true\n\t}\n\treturn false\n}\n\nfunc checkiflower(r rune) bool {\n\tif r < 97 || r > 122 {\n\t\treturn false\n\t}\n\n\treturn true\n}\n\nfunc checkifupper(r rune) bool {\n\tif r < 65 || r > 90 {\n\t\treturn false\n\t}\n\n\treturn true\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.Capitalize(\"Hello! How are you? How+are+things+4you?\"))\n}\n", "output": "Hello! How Are You? How+Are+Things+4you?"}, {"id": "iterativefactorial", "quest": 3, "kind": "Fonction", "file": "iterativefactorial.go", "sig": "func IterativeFactorial(nb int) int", "consigne": "Écrire une fonction itérative qui renvoie la factorielle de l'int passé en paramètre. Les erreurs (valeurs impossibles ou dépassements de capacité) renvoient 0.", "bref": "Les valeurs négatives ou trop grandes renvoient 0. Sinon on multiplie x par 1, 2, 3… jusqu'à nb. 0! = 1 fonctionne naturellement car la boucle ne tourne pas.", "tools": ["for i := 1", "x *= i", "garde overflow"], "lines": [[4, 4, "Élément neutre de la multiplication."], [5, 6, "Valeurs refusées → 0."], [8, 10, "x = 1 × 2 × … × nb."], [12, 12, "Pour nb = 0, la boucle ne tourne pas et on renvoie 1."]], "note": "Sur 64 bits, le plus grand résultat possible est 20!. De 21 à 25, le calcul dépasse et renvoie un nombre faux (IterativeFactorial(21) = -4249290049419214848) au lieu de 0. La bonne borne est nb > 20.", "code": "package piscine\n\nfunc IterativeFactorial(nb int) int {\n\tx := 1\n\tif nb < 0 || nb > 25 {\n\t\treturn 0\n\t} else {\n\t\tfor i := 1; i < nb+1; i++ {\n\t\t\tx *= i\n\t\t}\n\t}\n\treturn x\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.IterativeFactorial(4))\n}\n", "output": "24"}, {"id": "recursivefactorial", "quest": 3, "kind": "Fonction", "file": "recursivefactorial.go", "sig": "func RecursiveFactorial(nb int) int", "consigne": "Écrire une fonction récursive qui renvoie la factorielle de l'int passé en paramètre. Les erreurs (valeurs impossibles ou dépassements) renvoient 0. for est interdit pour cet exercice.", "bref": "La fonction s'appelle elle-même : n! = n × (n−1)!. Le cas de base 0 ou 1 renvoie 1 et arrête la récursion.", "tools": ["récursion", "cas de base", "pas de for"], "lines": [[4, 5, "Valeurs refusées → 0."], [7, 9, "Cas de base : 0! = 1! = 1. Sans lui, la récursion ne s'arrête jamais."], [10, 12, "Appel récursif avec nb-1."], [15, 15, "Jamais atteint, mais Go exige un return en fin de fonction."]], "note": "Même limite que la version itérative : la garde devrait être nb > 20.", "code": "package piscine\n\nfunc RecursiveFactorial(nb int) int {\n\tif nb < 0 || nb > 25 {\n\t\treturn 0\n\t} else {\n\t\tif nb == 1 || nb == 0 {\n\t\t\treturn 1\n\t\t}\n\t\tif nb > 1 {\n\t\t\treturn nb * RecursiveFactorial(nb-1)\n\t\t}\n\n\t}\n\treturn 0\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.RecursiveFactorial(4))\n}\n", "output": "24"}, {"id": "iterativepower", "quest": 3, "kind": "Fonction", "file": "iterativepower.go", "sig": "func IterativePower(nb int, power int) int", "consigne": "Écrire une fonction itérative qui renvoie nb à la puissance power. Une puissance négative renvoie 0. Les dépassements de capacité n'ont pas à être gérés.", "bref": "Puissance négative → 0, puissance 0 → 1. Sinon on multiplie x par nb, power fois.", "tools": ["for", "x *= nb"], "lines": [[4, 6, "Puissance négative interdite → 0."], [7, 9, "n⁰ = 1."], [10, 13, "On multiplie power fois par nb."]], "code": "package piscine\n\nfunc IterativePower(nb int, power int) int {\n\tif power < 0 {\n\t\treturn 0\n\t}\n\tif power == 0 {\n\t\treturn 1\n\t}\n\tx := 1\n\tfor i := 1; i <= power; i++ {\n\t\tx *= nb\n\t}\n\treturn x\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.IterativePower(4, 3))\n}\n", "output": "64"}, {"id": "recursivepower", "quest": 3, "kind": "Fonction", "file": "recursivepower.go", "sig": "func RecursivePower(nb int, power int) int", "consigne": "Écrire une fonction récursive qui renvoie nb à la puissance power. Une puissance négative renvoie 0. Les dépassements n'ont pas à être gérés. for est interdit pour cet exercice.", "bref": "nb^power = nb × nb^(power−1). Le cas de base power == 0 renvoie 1.", "tools": ["récursion", "cas de base power == 0"], "lines": [[4, 6, "Puissance négative → 0."], [7, 9, "Cas de base : arrêt de la récursion."], [10, 12, "Appel récursif en diminuant la puissance."]], "code": "package piscine\n\nfunc RecursivePower(nb int, power int) int {\n\tif power < 0 {\n\t\treturn 0\n\t}\n\tif power == 0 {\n\t\treturn 1\n\t}\n\tif power > 0 {\n\t\treturn nb * RecursivePower(nb, power-1)\n\t}\n\treturn 0\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.RecursivePower(4, 3))\n}\n", "output": "64"}, {"id": "fibonacci", "quest": 3, "kind": "Fonction", "file": "fibonacci.go", "sig": "func Fibonacci(index int) int", "consigne": "Écrire une fonction récursive qui renvoie la valeur située à la position index de la suite de Fibonacci. La première valeur est à l'indice 0. La suite commence ainsi : 0, 1, 1, 2, 3, etc. Un indice négatif renvoie -1. for est interdit pour cet exercice.", "bref": "Deux cas de base : F(0) = 0 et F(1) = 1. Au-delà, chaque terme est la somme des deux précédents : F(n) = F(n−2) + F(n−1).", "tools": ["double récursion", "2 cas de base"], "lines": [[4, 6, "Indice négatif → -1."], [7, 12, "Les deux premières valeurs de la suite."], [14, 16, "Somme des deux termes précédents."]], "code": "package piscine\n\nfunc Fibonacci(index int) int {\n\tif index < 0 {\n\t\treturn -1\n\t}\n\tif index == 0 {\n\t\treturn 0\n\t}\n\tif index == 1 {\n\t\treturn 1\n\t}\n\n\tif index > 0 {\n\t\treturn Fibonacci(index-2) + Fibonacci(index-1)\n\t}\n\treturn 0\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.Fibonacci(4))\n}\n", "output": "3"}, {"id": "isprime", "quest": 3, "kind": "Fonction", "file": "isprime.go", "sig": "func IsPrime(nb int) bool", "consigne": "Écrire une fonction qui renvoie true si l'int passé en paramètre est un nombre premier, sinon false. La fonction doit être optimisée pour éviter les time-outs du testeur. (Seuls les nombres positifs peuvent être premiers ; 1 n'est pas premier.)", "bref": "Tout nombre inférieur à 2 n'est pas premier. Ensuite on cherche un diviseur entre 2 et nb−1 : si nb % i == 0, il n'est pas premier.", "tools": ["nb % i == 0", "break"], "lines": [[5, 7, "0, 1 et les négatifs ne sont pas premiers."], [8, 15, "Recherche d'un diviseur : dès qu'on en trouve un, x = false et on sort."], [16, 16, "true si aucun diviseur n'a été trouvé."]], "note": "La boucle va jusqu'à nb : IsPrime(2147483647) prend environ 1 seconde, ce qui risque un time-out. Il suffit de tester jusqu'à la racine carrée : for i := 2; i*i <= nb; i++.", "code": "package piscine\n\nfunc IsPrime(nb int) bool {\n\tx := true\n\tif nb < 2 {\n\t\treturn false\n\t}\n\tfor i := 2; i < nb; i++ {\n\t\tif nb%i == 0 && nb != 2 {\n\t\t\tx = false\n\t\t\tbreak\n\n\t\t}\n\t\tx = true\n\t}\n\treturn x\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.IsPrime(5))\n\tfmt.Println(piscine.IsPrime(4))\n}\n", "output": "true\nfalse"}, {"id": "findnextprime", "quest": 3, "kind": "Fonction", "file": "findnextprime.go", "sig": "func FindNextPrime(nb int) int", "consigne": "Écrire une fonction qui renvoie le premier nombre premier supérieur ou égal à l'int passé en paramètre. La fonction doit être optimisée pour éviter les time-outs du testeur. (Seuls les nombres positifs peuvent être premiers.)", "bref": "Tout nombre ≤ 2 donne 2. Sinon on se place sur un nombre impair et on avance de 2 en 2 jusqu'à trouver un premier. Ispe teste la primalité en n'essayant que des diviseurs impairs.", "tools": ["for infini", "pas de 2", "fonction utilitaire"], "lines": [[4, 6, "2 est le plus petit premier."], [7, 9, "Un pair > 2 n'est jamais premier : on passe à l'impair suivant."], [10, 15, "Boucle infinie : teste nb, sinon nb+2, jusqu'au return."], [18, 24, "Ispe : élimine < 2 et les pairs."], [25, 29, "Essaie les diviseurs impairs de 3 à nb/3."]], "code": "package piscine\n\nfunc FindNextPrime(nb int) int {\n\tif nb <= 2 {\n\t\treturn 2\n\t}\n\tif nb%2 == 0 {\n\t\tnb = nb + 1\n\t}\n\tfor {\n\t\tif Ispe(nb) {\n\t\t\treturn nb\n\t\t}\n\t\tnb = nb + 2\n\t}\n}\n\nfunc Ispe(nb int) bool {\n\tif nb < 2 {\n\t\treturn false\n\t}\n\tif nb%2 == 0 {\n\t\treturn false\n\t}\n\tfor i := 3; i <= nb/3; i = i + 2 {\n\t\tif nb%i == 0 {\n\t\t\treturn false\n\t\t}\n\t}\n\n\treturn true\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.FindNextPrime(5))\n\tfmt.Println(piscine.FindNextPrime(4))\n}\n", "output": "5\n5"}, {"id": "appendrange", "quest": 4, "kind": "Fonction", "file": "appendrange.go", "sig": "func AppendRange(min, max int) []int", "consigne": "Écrire une fonction qui prend deux entiers min et max et renvoie un slice d'entiers contenant toutes les valeurs de min (inclus) à max (exclu). Si min est supérieur ou égal à max, la fonction renvoie un slice nil. L'utilisation de make est interdite pour cet exercice.", "bref": "On part d'un slice nil. Si l'intervalle est vide, on le renvoie tel quel. Sinon on ajoute min, min+1… avec append, qui agrandit le slice tout seul.", "tools": ["[]int(nil)", "append", "pas de make"], "lines": [[4, 4, "Slice nil : c'est aussi la valeur à renvoyer en cas d'erreur."], [5, 8, "l = nombre de valeurs ; l ≤ 0 signifie min ≥ max."], [10, 12, "append ajoute chaque valeur à la fin du slice."]], "code": "package piscine\n\nfunc AppendRange(min, max int) []int {\n\ts := []int(nil)\n\tl := max - min\n\tif l <= 0 {\n\t\treturn s\n\t}\n\n\tfor i := 0; i < l; i++ {\n\t\ts = append(s, min+i)\n\t}\n\treturn s\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.AppendRange(5, 10))\n\tfmt.Println(piscine.AppendRange(10, 5))\n}\n", "output": "[5 6 7 8 9]\n[]"}, {"id": "makerange", "quest": 4, "kind": "Fonction", "file": "makerange.go", "sig": "func MakeRange(min, max int) []int", "consigne": "Écrire une fonction qui prend un int min et un int max. Elle renvoie un slice d'ints contenant toutes les valeurs entre min et max : min inclus, max exclu. Si min est supérieur ou égal à max, un slice nil est renvoyé. append est interdit pour cet exercice.", "bref": "Comme la taille est connue d'avance (max − min), on crée le slice avec make, puis on remplit chaque case par son indice : s[i] = min + i.", "tools": ["make([]int, l)", "s[i] = ...", "pas d'append"], "lines": [[4, 8, "Intervalle vide → slice nil."], [9, 9, "make réserve exactement l cases, initialisées à 0."], [11, 13, "Remplissage case par case."]], "code": "package piscine\n\nfunc MakeRange(min, max int) []int {\n\ts := []int(nil)\n\tl := max - min\n\tif l <= 0 {\n\t\treturn s\n\t}\n\ts = make([]int, l)\n\n\tfor i := 0; i < l; i++ {\n\t\ts[i] = min + i\n\t}\n\treturn s\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Println(piscine.MakeRange(5, 10))\n\tfmt.Println(piscine.MakeRange(10, 5))\n}\n", "output": "[5 6 7 8 9]\n[]"}, {"id": "concatparams", "quest": 4, "kind": "Fonction", "file": "concatparams.go", "sig": "func ConcatParams(args []string) string", "consigne": "Écrire une fonction ConcatParams qui prend un slice de strings et renvoie une seule chaîne formée de tous les éléments, séparés par un retour à la ligne (\\n).", "bref": "On colle chaque élément à la chaîne résultat et on ajoute \"\\n\" après chacun, sauf le dernier.", "tools": ["for i, j := range", "s += ", "sauf le dernier"], "lines": [[4, 4, "Chaîne vide au départ."], [5, 6, "i = indice, j = l'élément ; on l'ajoute."], [7, 9, "Séparateur uniquement entre les éléments, pas en fin de chaîne."]], "code": "package piscine\n\nfunc ConcatParams(args []string) string {\n\tvar s string\n\tfor i, j := range args {\n\t\ts += j\n\t\tif i != len(args)-1 {\n\t\t\ts += \"\\n\"\n\t\t}\n\t}\n\treturn s\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\ttest := []string{\"Hello\", \"how\", \"are\", \"you?\"}\n\tfmt.Println(piscine.ConcatParams(test))\n}\n", "output": "Hello\nhow\nare\nyou?"}, {"id": "splitwhitespaces", "quest": 4, "kind": "Fonction", "file": "splitwhitespaces.go", "sig": "func SplitWhiteSpaces(s string) []string", "consigne": "Écrire une fonction qui sépare les mots d'une chaîne et les place dans un slice de strings. Les séparateurs sont les espaces, les tabulations et les retours à la ligne.", "bref": "On accumule les caractères dans word. Quand on tombe sur un séparateur et que word n'est pas vide, on ajoute le mot au résultat et on vide word. À la fin, le dernier mot est ajouté.", "tools": ["mot en cours", "append", "string(y)"], "lines": [[4, 5, "word = mot en construction, result = les mots trouvés."], [7, 8, "Caractère normal : on l'ajoute au mot en cours."], [9, 12, "Séparateur après un mot : on range le mot, puis on repart de zéro. Plusieurs espaces de suite ne créent pas de mot vide."], [14, 14, "Le dernier mot n'est suivi d'aucun séparateur : on l'ajoute ici."]], "note": "'\\n' n'est pas testé comme séparateur (\"a\\nb\" reste un seul mot). La ligne 14 ajoute aussi un mot vide si la chaîne se termine par un espace ou est vide : entourer de if word != \"\".", "code": "package piscine\n\nfunc SplitWhiteSpaces(s string) []string {\n\tword := \"\"\n\tvar result []string\n\tfor _, y := range s {\n\t\tif y != ' ' && y != '\\t' {\n\t\t\tword += string(y)\n\t\t} else if word != \"\" {\n\t\t\tresult = append(result, word)\n\t\t\tword = \"\"\n\t\t}\n\t}\n\tresult = append(result, word)\n\treturn result\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\tfmt.Printf(\"%#v\\n\", piscine.SplitWhiteSpaces(\"Hello how are you?\"))\n}\n", "output": "[]string{\"Hello\", \"how\", \"are\", \"you?\"}"}, {"id": "printwordstables", "quest": 4, "kind": "Fonction", "file": "printwordstables.go", "sig": "func PrintWordsTables(a []string)", "consigne": "Écrire une fonction qui reçoit un slice de strings et affiche chaque élément sur une ligne séparée.", "bref": "Pour chaque mot, on affiche ses caractères un par un avec PrintRune, puis un '\\n'.", "tools": ["2 boucles", "z01.PrintRune", "[]rune"], "lines": [[8, 8, "Parcourt chaque mot du slice."], [9, 14, "Affiche chaque caractère du mot."], [15, 15, "Retour à la ligne après chaque mot."]], "note": "range a[i] donne des indices d'octets, qui sont ensuite utilisés dans runes : avec un accent (« été »), l'indice dépasse et le programme plante. Parcourir directement for _, r := range a[i] évite le problème.", "code": "package piscine\n\nimport (\n\t\"github.com/01-edu/z01\"\n)\n\nfunc PrintWordsTables(a []string) {\n\tfor i := range a {\n\t\tfor j := range a[i] {\n\t\t\trunes := []rune(a[i])\n\t\t\t{\n\t\t\t\tz01.PrintRune(runes[j])\n\t\t\t}\n\t\t}\n\t\tz01.PrintRune('\\n')\n\t}\n}\n", "test": "package main\n\nimport \"piscine\"\n\nfunc main() {\n\ta := piscine.SplitWhiteSpaces(\"Hello how are you?\")\n\tpiscine.PrintWordsTables(a)\n}\n", "output": "Hello\nhow\nare\nyou?"}, {"id": "split", "quest": 4, "kind": "Fonction", "file": "split.go", "sig": "func Split(s, sep string) []string", "consigne": "Écrire une fonction qui reçoit une chaîne s et un séparateur sep, et renvoie le slice de strings obtenu en découpant s selon sep.", "bref": "Premier passage : compter les séparateurs pour savoir combien de morceaux créer, puis make le slice. Second passage : accumuler les caractères dans word ; quand s[i:i+len(sep)] == sep, ranger word et sauter le séparateur. Le dernier mot est rangé après la boucle.", "tools": ["s[i:i+n] == sep", "make", "2 passages"], "lines": [[4, 9, "On ajoute des espaces en fin de s pour que s[i:i+sublength] ne sorte jamais de la chaîne."], [10, 19, "1er passage : compte les séparateurs pour connaître la taille du résultat."], [21, 23, "Slice de la bonne taille, mot courant et indice d'écriture."], [26, 39, "Séparateur trouvé : si le mot n'est pas vide, on le range, puis on saute le reste du séparateur (i += sublength − 1)."], [40, 40, "Caractère normal : ajouté au mot courant."], [43, 49, "Range le dernier mot s'il n'est pas vide."]], "note": "La variable len (ligne 11) masque la fonction len() à partir de là, d'où les petites boucles for range pour mesurer word. Si le jury l'interroge, renommer cette variable en count simplifie tout.", "code": "package piscine\n\nfunc Split(s, sep string) []string {\n\tlength := len(s)\n\tsublength := len(sep)\n\n\tfor i := 0; i < sublength; i++ {\n\t\ts += \" \"\n\t}\n\tprev := false\n\tlen := 1\n\tfor i := 0; i < length; i++ {\n\t\tif (s[i:i+sublength] == sep) && !prev {\n\t\t\tprev = true\n\t\t\tlen++\n\t\t} else {\n\t\t\tprev = false\n\t\t}\n\t}\n\n\tarr := make([]string, len)\n\tword := \"\"\n\tarindex := 0\n\n\tfor i := 0; i < length; i++ {\n\t\tif s[i:i+sublength] == sep {\n\t\t\tl := 0\n\t\t\tfor i := range word {\n\t\t\t\tl = i + 1\n\t\t\t}\n\t\t\tif l == 0 {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tarr[arindex] = word\n\t\t\tarindex++\n\t\t\tword = \"\"\n\t\t\ti = i + sublength - 1\n\t\t\tcontinue\n\t\t}\n\t\tword += string(s[i])\n\t}\n\n\tl := 0\n\tfor i := range word {\n\t\tl = i + 1\n\t}\n\tif l != 0 {\n\t\tarr[arindex] = word\n\t}\n\treturn arr\n}\n", "test": "package main\n\nimport (\n\t\"fmt\"\n\t\"piscine\"\n)\n\nfunc main() {\n\ts := \"HelloHAhowHAareHAyou?\"\n\tfmt.Printf(\"%#v\\n\", piscine.Split(s, \"HA\"))\n}\n", "output": "[]string{\"Hello\", \"how\", \"are\", \"you?\"}"}]};
</script>
<script>
(() => {

        <div class="qpanel">
          <div class="draw">
            <div><div class="eyebrow">Quête ${e.quest} · ${e.kind}</div><h2>${e.id}</h2><code class="sig">${esc(e.sig)}</code></div>
            <div class="timerbox"><div class="eyebrow">Chrono · objectif 5 min</div><div class="timer${elapsed() > 300000 ? " late" : ""}" id="timer" role="timer" aria-live="off">${fmtT(elapsed())}</div>
              <div class="timerctl">
                <button type="button" class="iconbtn" id="q-pause" aria-label="${running ? "Mettre en pause" : "Démarrer le chrono"}">${ic(running ? "pause" : "play")}</button>
                <button type="button" class="iconbtn" id="q-reset" aria-label="Remettre le chrono à zéro" ${started ? "" : "disabled"}>${ic("reset")}</button>
              </div>
            </div>
          </div>
          <p class="consigne">${inline(e.consigne)}</p>
          <div class="qactions">
            ${started ? "" : `<button type="button" class="btn primary" id="q-start">${ic("play")} Démarrer l'épreuve</button>`}
            <button type="button" class="btn${started ? " primary" : ""}" id="q-show">${ic("eye")} Voir la correction</button>
            <button type="button" class="btn" id="q-next">${ic("shuffle")} Autre épreuve</button>
          </div>
          <label class="sub" for="q-draft" style="display:block">Brouillon</label>
          <textarea class="draft" id="q-draft" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="${e.kind === "Programme" ? "package main" : "package piscine"}&#10;&#10;// Écris ta solution ici (Tab pour indenter)…">${esc(drafts[e.id] || "")}</textarea>
          <div class="reveal" id="q-reveal" ${qs.shown ? "" : "hidden"}>
            <h3 class="sub" style="margin-top:0">Comparaison</h3>
            <div class="compare">
              <div><h4>Ton brouillon</h4><pre class="draftview" id="q-draftview"></pre></div>
              <div><h4>Ton code · ${esc(e.file)}</h4><div class="codebox"><div class="code">${codeLines(e.code, "quiz")}</div></div></div>
            </div>
            ${e.note ? `<div class="warnbox"><strong>À savoir</strong><p>${inline(e.note)}</p></div>` : ""}
            <div class="qactions">
              <button type="button" class="btn ok" id="q-ok">${ic("check")} Réussi</button>
              <button type="button" class="btn bad" id="q-ko">${ic("x")} À revoir</button>
              <a class="btn" href="#/quete-${e.quest}/${e.id}">Ouvrir la fiche ${ic("right")}</a>
            </div>
          </div>
        </div>
        <aside class="side">
          <div class="qpanel"><h3>Quêtes dans le tirage</h3>
            <div class="filters">${[1,2,3,4].map(q => `<label><input type="checkbox" data-q="${q}" ${qs.quests.includes(q) ? "checked" : ""}> Q${q}</label>`).join("")}</div>
          </div>
          <div class="qpanel"><h3>Bilan</h3>
            <div class="stats"><div class="stat ok"><b>${ok}</b><span>réussies</span></div><div class="stat bad"><b>${ko}</b><span>à revoir</span></div></div>
            ${ok + ko ? `<button type="button" class="btn danger" id="q-wipe" style="margin-top:12px;width:100%;justify-content:center">${ic("reset")} ${qs.confirmReset ? "Confirmer la remise à zéro" : "Remettre le bilan à zéro"}</button>` : ""}
          </div>
          <div class="qpanel"><h3>À retravailler</h3>
            ${toReview.length ? `<div class="review">${toReview.map(x => `<a class="chip" href="#/quete-${x.quest}/${x.id}">${x.id}</a>`).join("")}</div>` : `<p class="empty">Rien pour l'instant. Les épreuves notées « À revoir » apparaîtront ici et sortiront plus souvent.</p>`}
          </div>
        </aside>
      </div>`;
    window.scrollTo(0, 0);
    if (running) runTimer();
    const $ = id => document.getElementById(id);
    const draft = $("q-draft");
    const syncView = () => { const v = $("q-draftview"); if (v) v.textContent = draft.value.trim() ? draft.value : "(brouillon vide)"; };
    syncView();
    const startT = () => { if (!qs.start){ qs.start = Date.now(); runTimer(); const pb = $("q-pause"); pb.innerHTML = ic("pause"); pb.setAttribute("aria-label", "Mettre en pause"); $("q-reset").disabled = false; } };
    if ($("q-start")) $("q-start").onclick = () => { startT(); quiz(); requestAnimationFrame(() => $("q-draft").focus()); };
    $("q-pause").onclick = () => {
      if (qs.start){ qs.acc = elapsed(); qs.start = null; clearInterval(qs.tick); live("Chrono en pause"); }
      else { startT(); live("Chrono lancé"); }
      quiz();
    };
    $("q-reset").onclick = () => { qs.start = null; qs.acc = 0; clearInterval(qs.tick); live("Chrono remis à zéro"); quiz(); };
    $("q-show").onclick = () => {
      if (qs.start){ qs.acc = elapsed(); qs.start = null; clearInterval(qs.tick); }
      qs.shown = true; syncView();
      const r = $("q-reveal"); r.hidden = false;
      r.scrollIntoView({block: "start", behavior: reduced() ? "auto" : "smooth"});
    };
    $("q-next").onclick = () => { pick(); quiz(); };
    const grade = k => { const s = stats[e.id] || {ok: 0, ko: 0}; s[k] = (s[k] || 0) + 1; stats[e.id] = s; store.set("quiz", stats); delete drafts[e.id]; store.set("drafts", drafts); live(k === "ok" ? "Noté réussi" : "Noté à revoir"); pick(); quiz(); };
    $("q-ok").onclick = () => grade("ok");
    $("q-ko").onclick = () => grade("ko");
    if ($("q-wipe")) $("q-wipe").onclick = () => {
      if (!qs.confirmReset){ qs.confirmReset = true; quiz(); return; }
      stats = {}; store.set("quiz", stats); qs.confirmReset = false; live("Bilan remis à zéro"); quiz();
    };
    document.querySelectorAll("[data-q]").forEach(cb => cb.onchange = () => {
      qs.quests = [...document.querySelectorAll("[data-q]:checked")].map(x => +x.dataset.q);
      if (!qs.quests.length){ qs.quests = [+cb.dataset.q]; cb.checked = true; }
      store.set("quizq", qs.quests);
      if (!qs.quests.includes(qs.cur.quest)){ pick(); quiz(); }
    });
    draft.addEventListener("input", () => { startT(); drafts[e.id] = draft.value; store.set("drafts", drafts); if (qs.shown) syncView(); });
    draft.addEventListener("keydown", ev => {
      if (ev.key === "Tab" && !ev.shiftKey){ ev.preventDefault(); const a = draft.selectionStart; draft.setRangeText("\t", a, draft.selectionEnd, "end"); draft.dispatchEvent(new Event("input")); }
      if (ev.key === "Escape") draft.blur();
    });
  }
  function runTimer(){
    clearInterval(qs.tick);
    const upd = () => {
      const el = document.getElementById("timer");
      if (!el){ clearInterval(qs.tick); return; }
      const d = elapsed(); el.textContent = fmtT(d); el.classList.toggle("late", d > 300000);
    };
    upd(); qs.tick = setInterval(upd, 500);
  }

  /* ---------- recherche ---------- */
  const pal = document.getElementById("pal"), palQ = document.getElementById("pal-q"), palRes = document.getElementById("pal-res");
  let palSel = 0, palItems = [];
  const hay = EX.map(e => ({e, id: norm(e.id), txt: norm([e.sig, e.consigne, e.tools.join(" "), e.bref].join(" "))}));
  function palRender(){
    const q = norm(palQ.value.trim());
    if (!q) palItems = EX.slice();
    else {
      const words = q.split(/\s+/);
      palItems = hay.map(h => {
        let score = 0;
        for (const w of words){
          if (h.id === w) score += 100;
          else if (h.id.startsWith(w)) score += 60;
          else if (h.id.includes(w)) score += 40;
          else if (h.txt.includes(w)) score += 10;
          else return null;
        }
        return {e: h.e, score};
      }).filter(Boolean).sort((a, b) => b.score - a.score).map(x => x.e);
    }
    palSel = Math.min(palSel, Math.max(palItems.length - 1, 0));
    const mark = s => { const w = palQ.value.trim(); if (!w) return esc(s); const i = norm(s).indexOf(norm(w)); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + w.length)) + "</mark>" + esc(s.slice(i + w.length)); };
    palRes.innerHTML = palItems.length
      ? palItems.map((e, i) => `<li role="presentation"><a role="option" id="pal-${e.id}" href="#/quete-${e.quest}/${e.id}" aria-selected="${i === palSel}"><b>${mark(e.id)}</b><em>Q${e.quest} · ${e.kind}</em><small>${esc(e.consigne)}</small></a></li>`).join("")
      : `<li class="palempty">Aucune épreuve ne correspond à « ${esc(palQ.value)} ». Essaie un nom (split, atoi…) ou un outil (append, récursion, rune).</li>`;
    palQ.setAttribute("aria-activedescendant", palItems[palSel] ? "pal-" + palItems[palSel].id : "");
  }
  function openPal(){
    if (pal.open) return;
    palQ.value = ""; palSel = 0; palRender();
    pal.showModal();
    palQ.focus();
  }
  const closePal = () => pal.open && pal.close();
  document.getElementById("open-search").addEventListener("click", openPal);
  document.getElementById("pal-close").addEventListener("click", closePal);
  pal.addEventListener("click", ev => { if (ev.target === pal) closePal(); if (ev.target.closest("a[role=option]")) closePal(); });
  palQ.addEventListener("input", () => { palSel = 0; palRender(); });
  palQ.addEventListener("keydown", ev => {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp"){
      ev.preventDefault();
      if (!palItems.length) return;
      palSel = (palSel + (ev.key === "ArrowDown" ? 1 : -1) + palItems.length) % palItems.length;
      palRender();
      document.getElementById("pal-" + palItems[palSel].id).scrollIntoView({block: "nearest"});
    } else if (ev.key === "Enter" && palItems[palSel]){
      ev.preventDefault();
      const e = palItems[palSel]; closePal(); location.hash = `#/quete-${e.quest}/${e.id}`;
    }
  });
  document.addEventListener("keydown", ev => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if ((ev.key === "/" && !typing) || ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k")){ ev.preventDefault(); openPal(); }
  });

  /* ---------- interactions communes ---------- */
  app.addEventListener("change", ev => {
    const id = ev.target.dataset && ev.target.dataset.done;
    if (!id) return;
    done[id] = ev.target.checked; if (!done[id]) delete done[id];
    live(done[id] ? id + " marqué comme maîtrisé" : id + " à retravailler");
    store.set("done", done);
    const tick = document.querySelector(`[data-toc="${id}"] .tick`);
    tick && tick.classList.toggle("on", !!done[id]);
  });
  app.addEventListener("click", ev => {
    const rv = ev.target.closest("[data-reveal]");
    if (rv){ revealed.add(rv.dataset.reveal); applyTrain(); document.getElementById(rv.dataset.reveal + "-code").focus?.(); live("Code révélé"); return; }
    if (ev.target.closest("[data-open-search]")){ openPal(); return; }
    const li = ev.target.closest(".notes li");
    if (li){ togglePin(li); return; }
    const cp = ev.target.closest("[data-copy]");
    if (cp){
      const txt = byId[cp.dataset.copy].code;
      const done = () => { cp.textContent = "Copié"; live("Code copié"); setTimeout(() => cp.textContent = "Copier", 1400); };
      try { navigator.clipboard.writeText(txt).then(done, () => { cp.textContent = "Sélectionne le code"; }); } catch(e){ cp.textContent = "Sélectionne le code"; }
    }
  });
  const lite = (li, on) => {
    const ex = li.closest(".ex"); if (!ex) return;
    for (let i = +li.dataset.a; i <= +li.dataset.b; i++){
      const l = document.getElementById(`${ex.dataset.id}-L${i}`); l && l.classList.toggle("hl", on);
    }
  };
  function togglePin(li){
    const on = li.getAttribute("aria-pressed") !== "true";
    li.parentElement.querySelectorAll("li[aria-pressed='true']").forEach(o => { if (o !== li){ o.setAttribute("aria-pressed", "false"); pinLines(o, false); } });
    li.setAttribute("aria-pressed", String(on));
    pinLines(li, on);
  }
  function pinLines(li, on){
    const ex = li.closest(".ex"); if (!ex) return;
    for (let i = +li.dataset.a; i <= +li.dataset.b; i++){ const l = document.getElementById(`${ex.dataset.id}-L${i}`); l && l.classList.toggle("pin", on); }
  }
  app.addEventListener("keydown", ev => {
    const li = ev.target.closest && ev.target.closest(".notes li");
    if (li && (ev.key === "Enter" || ev.key === " ")){ ev.preventDefault(); togglePin(li); }
  });
  ["mouseover", "focusin"].forEach(t => app.addEventListener(t, ev => { const li = ev.target.closest && ev.target.closest(".notes li"); li && lite(li, true); }));
  ["mouseout", "focusout"].forEach(t => app.addEventListener(t, ev => { const li = ev.target.closest && ev.target.closest(".notes li"); li && lite(li, false); }));

  /* ---------- routeur ---------- */
  function route(){
    const r = location.hash ? location.hash.replace(/^#\/?/, "") : "quete-3";
    renderNav(r);
    clearInterval(qs.tick);
    closePal();
    let m;
    if ((m = r.match(/^quete-([1-4])(?:\/(\w+))?$/))){ quest(+m[1], m[2]); return; }
    shownQuest = 0;
    if (r === "antiseche") sheet();
    else if (r === "quiz") quiz();
    else home();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>

</body>
</html>
